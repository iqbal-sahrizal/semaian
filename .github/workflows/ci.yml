name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: semaian_test
          POSTGRES_USER: semaian
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U semaian -d semaian_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: services/api/go.sum
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l services/api)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files: $unformatted"
            exit 1
          fi
      - name: Build Go binaries
        run: cd services/api && go build ./...
      - name: Run go vet
        run: cd services/api && go vet ./...
      - name: Run unit tests with race detector
        run: cd services/api && go test -race ./...
      - name: Run integration tests
        env:
          DATABASE_URL: postgres://semaian:test_password@localhost:5432/semaian_test?sslmode=disable
        run: cd services/api && go test -race -tags=integration ./...
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd services/api && govulncheck ./...

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stoplightio/spectral-action@v0.8.12
        with:
          file_glob: "docs/openapi/v1/openapi.yaml"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

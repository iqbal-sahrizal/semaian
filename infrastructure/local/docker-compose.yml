services:
  postgres:
    image: postgres:17-alpine
    container_name: semaian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: semaian_dev
      POSTGRES_USER: semaian
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - semaian_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U semaian -d semaian_dev" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  semaian_postgres_data:
